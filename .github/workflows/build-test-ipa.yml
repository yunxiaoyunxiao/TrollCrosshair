name: TrollCrosshair 1.2 Build 6

on:
  workflow_dispatch:
  push:
    branches:
      - trollcrosshair-1.2
    paths:
      - 'TrollCrosshair-1.2-source.tar.bz2'
      - 'build6-patch-parts/**'
      - '.github/workflows/build-test-ipa.yml'

permissions:
  contents: read

env:
  BUILD_NUMBER: 6

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode and install ldid
        run: |
          xcodebuild -version
          xcodebuild -showsdks
          brew install ldid

      - name: Restore Build 5 source and apply Build 6 patch
        run: |
          set -euo pipefail
          mkdir -p source patch
          tar -xjf TrollCrosshair-1.2-source.tar.bz2 -C source
          cat build6-patch-parts/00.b64 build6-patch-parts/01.b64 build6-patch-parts/02.b64 > build6-patch.b64
          base64 -D < build6-patch.b64 > build6-patch.tar.xz
          tar -xJf build6-patch.tar.xz -C patch
          patch -p5 -d source/TrollCrosshair-1.2 < patch/build6-source.patch
          PROJECT="source/TrollCrosshair-1.2/TrollCrosshair/TrollCrosshair.xcodeproj"
          APP_SOURCE="source/TrollCrosshair-1.2/TrollCrosshair/TrollCrosshair"
          test -f "$APP_SOURCE/TrollCrosshair.entitlements"
          grep -q 'diagnosticLog' "$APP_SOURCE/FloatingController.h"
          grep -q 'posix_spawn failed' "$APP_SOURCE/FloatingController.m"
          grep -q '复制诊断日志到剪贴板' "$APP_SOURCE/RootViewController.mm"
          grep -q 'openAppWhenRun = true' "$APP_SOURCE/FloatingShortcuts.swift"
          grep -q 'com.apple.private.security.no-sandbox' "$APP_SOURCE/TrollCrosshair.entitlements"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$APP_SOURCE/Info.plist" | grep -q '^6$'
          xcodebuild -list -project "$PROJECT"

      - name: Build iOS app
        run: |
          set -o pipefail
          PROJECT="source/TrollCrosshair-1.2/TrollCrosshair/TrollCrosshair.xcodeproj"
          xcodebuild \
            -project "$PROJECT" \
            -scheme TrollCrosshair \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$PWD/DerivedData" \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            CLANG_ENABLE_OBJC_ARC=YES \
            OTHER_LDFLAGS="-framework PhotosUI -framework UniformTypeIdentifiers -framework ImageIO" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee build.log

      - name: Embed and verify TrollStore entitlements
        run: |
          set -euo pipefail
          APP="$PWD/DerivedData/Build/Products/Release-iphoneos/TrollCrosshair.app"
          ENTITLEMENTS="$PWD/source/TrollCrosshair-1.2/TrollCrosshair/TrollCrosshair/TrollCrosshair.entitlements"
          test -x "$APP/TrollCrosshair"
          ldid -S"$ENTITLEMENTS" "$APP/TrollCrosshair"
          ldid -e "$APP/TrollCrosshair" > embedded-entitlements.plist
          plutil -lint embedded-entitlements.plist
          /usr/libexec/PlistBuddy -c 'Print :com.apple.private.security.no-sandbox' embedded-entitlements.plist | grep -q true
          /usr/libexec/PlistBuddy -c 'Print :com.apple.private.security.storage.AppDataContainers' embedded-entitlements.plist | grep -q true
          /usr/libexec/PlistBuddy -c 'Print :platform-application' embedded-entitlements.plist | grep -q true
          cat embedded-entitlements.plist

      - name: Package and inspect IPA
        run: |
          set -euo pipefail
          APP="$PWD/DerivedData/Build/Products/Release-iphoneos/TrollCrosshair.app"
          mkdir -p package/Payload
          ditto "$APP" package/Payload/TrollCrosshair.app
          cd package
          ditto -c -k --sequesterRsrc --keepParent Payload "$GITHUB_WORKSPACE/TrollCrosshair-1.2-build${BUILD_NUMBER}-TrollStore.ipa"
          cd "$GITHUB_WORKSPACE"
          unzip -t "TrollCrosshair-1.2-build${BUILD_NUMBER}-TrollStore.ipa"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' package/Payload/TrollCrosshair.app/Info.plist | grep -q 'com.floatimage.app'
          /usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' package/Payload/TrollCrosshair.app/Info.plist | grep -q '^6$'
          /usr/libexec/PlistBuddy -c 'Print :MinimumOSVersion' package/Payload/TrollCrosshair.app/Info.plist | grep -q '17.0'
          ldid -e package/Payload/TrollCrosshair.app/TrollCrosshair | grep -E 'no-sandbox|platform-application|AppDataContainers'
          xcrun --sdk iphoneos lipo -info package/Payload/TrollCrosshair.app/TrollCrosshair
          strings package/Payload/TrollCrosshair.app/TrollCrosshair | grep -q 'HUD startup handshake succeeded'
          strings package/Payload/TrollCrosshair.app/TrollCrosshair | grep -q 'TrollCrosshair-diagnostics.log'

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: TrollCrosshair-1.2-build6-TrollStore-IPA
          path: TrollCrosshair-1.2-build6-TrollStore.ipa
          if-no-files-found: error
          retention-days: 30

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: TrollCrosshair-1.2-build6-build-log
          path: build.log
          if-no-files-found: ignore
          retention-days: 7
