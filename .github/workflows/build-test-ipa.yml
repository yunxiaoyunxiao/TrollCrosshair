name: TrollCrosshair 1.2 iOS Build

on:
  workflow_dispatch:
  push:
    branches:
      - trollcrosshair-1.2
    paths:
      - 'TrollCrosshair-1.2-source.tar.bz2'
      - '.github/workflows/build-test-ipa.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          xcodebuild -version
          xcodebuild -showsdks

      - name: Unpack source
        run: |
          mkdir -p source
          tar -xjf TrollCrosshair-1.2-source.tar.bz2 -C source
          PROJECT="source/TrollCrosshair-1.2/TrollCrosshair/TrollCrosshair.xcodeproj"
          test -d "$PROJECT"
          xcodebuild -list -project "$PROJECT"

      - name: Build unsigned iOS app
        run: |
          PROJECT="source/TrollCrosshair-1.2/TrollCrosshair/TrollCrosshair.xcodeproj"
          xcodebuild \
            -project "$PROJECT" \
            -scheme TrollCrosshair \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$PWD/DerivedData" \
            CLANG_ENABLE_OBJC_ARC=YES \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build | tee build.log
          test ${PIPESTATUS[0]} -eq 0

      - name: Package unsigned IPA for TrollStore testing
        run: |
          APP="$PWD/DerivedData/Build/Products/Release-iphoneos/TrollCrosshair.app"
          test -d "$APP"
          mkdir -p package/Payload
          ditto "$APP" package/Payload/TrollCrosshair.app
          cd package
          ditto -c -k --sequesterRsrc --keepParent Payload "$GITHUB_WORKSPACE/TrollCrosshair-1.2-test-unsigned.ipa"
          cd "$GITHUB_WORKSPACE"
          unzip -t TrollCrosshair-1.2-test-unsigned.ipa
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' package/Payload/TrollCrosshair.app/Info.plist
          /usr/libexec/PlistBuddy -c 'Print :MinimumOSVersion' package/Payload/TrollCrosshair.app/Info.plist

      - name: Upload test IPA
        uses: actions/upload-artifact@v4
        with:
          name: TrollCrosshair-1.2-test-unsigned-IPA
          path: TrollCrosshair-1.2-test-unsigned.ipa
          if-no-files-found: error
          retention-days: 30

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: TrollCrosshair-1.2-build-log
          path: build.log
          if-no-files-found: ignore
          retention-days: 7
