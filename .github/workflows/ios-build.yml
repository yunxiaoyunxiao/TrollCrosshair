name: iOS Build

on:
  push:
    branches:
      - floatimage-build-setup
  workflow_dispatch:

concurrency:
  group: trollcrosshair-ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Build FloatImage
        run: |
          xcodebuild \
            -project TrollCrosshair_1_0/TrollCrosshair.xcodeproj \
            -scheme TrollCrosshair \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Package app
        run: |
          mkdir -p build/artifacts
          ditto -c -k --sequesterRsrc --keepParent \
            build/DerivedData/Build/Products/Release-iphoneos/TrollCrosshair.app \
            build/artifacts/TrollCrosshair-unsigned.zip

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: TrollCrosshair-unsigned-app
          path: build/artifacts/TrollCrosshair-unsigned.zip
          if-no-files-found: error
