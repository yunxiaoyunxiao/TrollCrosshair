name: iOS Build

on:
  push:
    branches:
      - floatimage-build-setup
  workflow_dispatch:

concurrency:
  group: trollcrosshair-ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Install ldid
        run: brew install ldid

      - name: Build FloatImage
        run: |
          xcodebuild \
            -project TrollCrosshair_1_0/TrollCrosshair.xcodeproj \
            -scheme TrollCrosshair \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Sign with TrollStore entitlements and package IPA
        run: |
          APP_PATH="build/DerivedData/Build/Products/Release-iphoneos/TrollCrosshair.app"
          mkdir -p build/package/Payload build/artifacts
          ldid -STrollCrosshair_1_0/TrollCrosshair/entitlements.plist "$APP_PATH"
          ditto "$APP_PATH" build/package/Payload/TrollCrosshair.app
          cd build/package
          /usr/bin/zip -qr ../artifacts/TrollCrosshair.ipa Payload

      - name: Upload TrollStore IPA
        uses: actions/upload-artifact@v4
        with:
          name: TrollCrosshair-IPA
          path: build/artifacts/TrollCrosshair.ipa
          if-no-files-found: error
